function eye(){const p=$('#lp'),h=p.type==='password';p.type=h?'text':'password';$('#sl').style.display=h?'none':''}
async function doLogin(){if(KEY.startsWith('PEGA'))return toast('Falta pegar la clave pública de Supabase en el archivo');try{await auth({email:v('lu').toLowerCase(),password:$('#lp').value},'password')}catch(e){return toast('Usuario o contraseña incorrectos')}try{await sess()}catch(e){return toast('Este usuario no tiene permiso para entrar al sistema.')}try{await pull()}catch(e){console.error(e);U=null;return toast('No se pudo leer la base de datos. ¿Ejecutaste el script SQL?')}R()}
const out=()=>{U=null;TK=RT=null;KS=0;V='home';try{sessionStorage.removeItem('cdmt_rt')}catch(e){}R()};
function R(){const a=$('#app');if(!U){a.innerHTML=login();return}
const m=M.find(x=>x[0]===V);if(m&&!m[3].includes(U.rol))V='home';
a.innerHTML=`<header><img src="${LOGO}" alt="Consorcio Deportivo Madrid Trujillo" class=hl onclick="go('home')"><span class=sp></span><span class=mu>${esc(U.nom)}</span>${V!=='home'?'<button class=g onclick="go(\'home\')">← Menú</button>':''}<button class=g onclick="out()">Salir</button></header><main class="${V==='home'?'hm':''}">${V==='home'?home():`<h2 class=h2><span class=hi>${ico(m[4],28)}</span> ${m[1]}</h2>`+VW[V]()}</main>`;if(V==='mat'){FOTO=ED?S.alu.find(x=>x.id===ED).foto:'';upHor()}}
const MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
let CS={u:null,m:null,r:6,v:'d',mo:today().slice(0,7)};
const uMes=m=>{const c=S.caja.filter(x=>x.f.startsWith(m)),ing=c.filter(x=>x.t==='I').reduce((t,x)=>t+x.m,0),eg=c.filter(x=>x.t==='E').reduce((t,x)=>t+x.m,0),kc=S.kits.filter(k=>k.f.startsWith(m)).reduce((t,k)=>t+k.c,0),pl=S.asis.filter(x=>x.t==='P'&&x.ok&&x.f.startsWith(m)).reduce((t,x)=>{const h=S.hor.find(h=>h.id===x.h),p=S.personal.find(p=>p.id===x.ref);return h&&p?t+hrs(h)*p.precio:t},0),al=S.sedes.reduce((t,s)=>t+ +s.costo,0);return {ing,u:ing-eg-kc-pl-al}};
const bars=(d,k)=>{const W=600,H=190,pm=Math.max(0,...d.map(x=>x.v)),mn=Math.min(0,...d.map(x=>x.v)),rg=(pm-mn)||1,z=15+pm/rg*(H-30),w=W/d.length;return `<svg viewBox="0 0 ${W} ${H+22}" width="100%" role="img"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--bd)"/>`+d.map((x,i)=>{const h=Math.abs(x.v)/rg*(H-30),y=x.v>=0?z-h:z;return `<g onclick="chSel('${k}',${i})" style="cursor:pointer"><rect x="${i*w+w*.14}" y="${y}" width="${w*.72}" height="${Math.max(h,2)}" rx="3" fill="${x.v<0?'var(--rd)':'var(--ac)'}" opacity="${CS[k]===i?1:.72}"><title>${esc(x.n)}: ${esc(x.t)}</title></rect><text x="${i*w+w/2}" y="${H+15}" text-anchor="middle" font-size="11" fill="var(--mu)">${esc(x.l)}</text></g>`}).join('')+'</svg>'};
const chSel=(k,i)=>{CS[k]=CS[k]===i?null:i;rc()},rc=()=>{$('#ch').innerHTML=charts()};
function charts(){const n=new Date(),ud=[...Array(CS.r)].map((_,j)=>{const d=new Date(n.getFullYear(),n.getMonth()-(CS.r-1-j),1),r=uMes(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));return {l:MS[d.getMonth()],n:MS[d.getMonth()]+' '+d.getFullYear(),v:r.u,t:money(r.u),ing:r.ing}});let md;

VW.ger=()=>{const rows=S.sedes.map(s=>{const mc=S.caja.filter(x=>x.sede===s.id&&x.f.startsWith(GM)),ing=mc.filter(x=>x.t==='I').reduce((t,x)=>t+x.m,0),eg=mc.filter(x=>x.t==='E').reduce((t,x)=>t+x.m,0),kc=S.kits.filter(k=>k.sede===s.id&&k.f.startsWith(GM)).reduce((t,k)=>t+k.c,0),pl=S.asis.filter(x=>x.t==='P'&&x.ok&&x.f.startsWith(GM)).reduce((t,x)=>{const h=S.hor.find(h=>h.id===x.h);const p=S.personal.find(p=>p.id===x.ref);return h&&p&&h.sede===s.id?t+hrs(h)*p.precio:t},0);return {s,ing,eg,kc,pl,al:+s.costo,u:ing-eg-kc-pl-s.costo}}),mx=Math.max(1,...rows.map(r=>Math.abs(r.u)));
