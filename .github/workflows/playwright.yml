name: ERP Quality Checks

concurrency:
  # Un solo flujo de pruebas por rama, aunque se disparen push y pull_request.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, "auditoria/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Verify ERP modules
        run: npm run verificar:modulos

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for QA preview deployment
        id: qa_preview
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${ERP_URL%/}/app/03-datos-supabase.js" 2>/dev/null | grep -q 'qa-cleanup-personal-test-961b49da'; then
              echo "La vista previa de QA sirve el helper de persistencia real esperado."
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Esperando el despliegue correcto de QA (${attempt}/12)..."
            sleep 10
          done
          echo "::error::Vercel todavía no publicó la versión QA esperada. No se puede declarar aprobada una ejecución sin pruebas E2E."
          echo "deployed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Run Playwright tests
        if: steps.qa_preview.outputs.deployed == 'true'
        run: npx playwright test
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
