name: ERP Quality Checks

concurrency:
  # Un solo flujo de pruebas por rama, aunque se disparen push y pull_request.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, "auditoria/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Verify ERP modules
        run: npm run verificar:modulos

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact QA preview revision
        id: qa_preview
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
        run: |
          if [ -n "$ERP_URL" ] && curl --fail --silent --show-error "${ERP_URL%/}/app/03-datos-supabase.js" 2>/dev/null | grep -Fq 'qa-source-audit-20261127-01'; then
            echo "La vista previa corresponde al marcador de esta revisión QA."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Se omite Playwright: no hay una vista previa con el marcador de esta revisión. No se probará una versión antigua."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Playwright omitido"
              echo "La vista previa QA no contiene `qa-source-audit-20261127-01`. Se ejecutaron los controles estáticos, pero no se atribuyen resultados E2E a esta revisión."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Playwright tests
        if: steps.qa_preview.outputs.deployed == 'true'
        run: npx playwright test
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ steps.qa_preview.outputs.deployed == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
