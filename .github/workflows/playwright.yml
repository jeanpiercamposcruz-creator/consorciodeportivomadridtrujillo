name: ERP Quality Checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, "auditoria/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Verify ERP modules
        run: npm run verificar:modulos

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for QA preview deployment
        id: qa_preview
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${ERP_URL%/}/app/14-vistas-horarios.js" 2>/dev/null | grep -q 'qa-pagos-v4-caja-auditoria-20261125'; then
              echo "La vista previa de QA sirve exactamente la versión de pagos esperada."
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Esperando el despliegue correcto de QA (${attempt}/60)..."
            sleep 10
          done
          echo "::warning::Vercel todavía no publicó la versión QA esperada; las pruebas E2E se omitirán para no probar código antiguo."
          echo "deployed=false" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        if: steps.qa_preview.outputs.deployed == 'true'
        run: npx playwright test
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
