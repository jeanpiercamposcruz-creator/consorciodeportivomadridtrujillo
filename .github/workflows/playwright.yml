name: ERP Quality Checks

concurrency:
  # Un solo flujo de pruebas por rama, aunque se disparen push y pull_request.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, "auditoria/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  quality:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            console.log('Resumen de vulnerabilidades:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable
              }));
            }
          } catch (error) {
            console.log('No se pudo interpretar npm-audit.json:', String(error));
          }
          NODE

      - name: Upload npm audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Apply safe npm security updates on QA branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/auditoria/primera-revision' }}
        run: |
          npm audit fix --package-lock-only --ignore-scripts || echo "npm audit fix informó que quedan avisos o no pudo aplicar todos los cambios."
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "[QA] Actualizar dependencias con parches de seguridad"
            git push origin HEAD:refs/heads/auditoria/primera-revision
          else
            echo "No hay cambios semver-seguros pendientes en package-lock.json."
          fi
          npm ci
          npm audit --json > npm-audit-after.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'));
            console.log('Vulnerabilidades tras la remediación:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          } catch (error) {
            console.log('No se pudo interpretar el informe posterior:', String(error));
          }
          NODE
          npm audit --audit-level=moderate

      - name: Upload post-remediation npm audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-after-report
          path: npm-audit-after.json
          retention-days: 14
          if-no-files-found: ignore

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Verify ERP modules
        run: npm run verificar:modulos

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact QA preview revision
        id: qa_preview
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
        run: |
          if [ -n "$ERP_URL" ] && curl --fail --silent --show-error "${ERP_URL%/}/app/03-datos-supabase.js" 2>/dev/null | grep -Fq 'qa-source-audit-20261127-02'; then
            echo "La vista previa corresponde al marcador de esta revisión QA."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Se omite Playwright: no hay una vista previa con el marcador de esta revisión. No se probará una versión antigua."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Playwright omitido"
              echo 'La vista previa QA no contiene qa-source-audit-20261127-02. Se ejecutaron los controles estáticos, pero no se atribuyen resultados E2E a esta revisión.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Playwright tests
        if: steps.qa_preview.outputs.deployed == 'true'
        run: npx playwright test
        env:
          ERP_URL: ${{ secrets.ERP_URL }}
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ steps.qa_preview.outputs.deployed == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
