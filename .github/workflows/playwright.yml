name: ERP Quality Checks

concurrency:
  # Supabase QA es compartido: ningún evento ni rama puede ejecutar pruebas
  # concurrentes contra los mismos registros, IDs y ajustes globales.
  group: erp-quality-supabase-qa
  # No cancelar una ejecución activa: su cleanup debe terminar antes de la siguiente.
  cancel-in-progress: false

on:
  push:
    branches: [main, master, "auditoria/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  quality:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # La aplicación local se compila exclusivamente contra el proyecto Supabase QA.
    # La clave anon es publicable; nunca se utiliza la service_role.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://yiredilknlwbzwvwlqyx.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpcmVkaWxrbmx3Ynp3dndscXl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NjEyMTUsImV4cCI6MjExMDAzNzIxNX0.txFDAeE6Vl2s4J1JTVQFF0IU20QRqu2132r7yQlMLPo'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            console.log('Resumen de vulnerabilidades:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable
              }));
            }
          } catch (error) {
            console.log('No se pudo interpretar npm-audit.json:', String(error));
          }
          NODE

      - name: Upload npm audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Apply safe npm security updates on QA branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/auditoria/primera-revision' }}
        run: |
          npm audit fix --package-lock-only --ignore-scripts || echo "npm audit fix informó que quedan avisos o no pudo aplicar todos los cambios."
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "[QA] Actualizar dependencias con parches de seguridad"
            git push origin HEAD:refs/heads/auditoria/primera-revision
          else
            echo "No hay cambios semver-seguros pendientes en package-lock.json."
          fi
          npm ci
          npm audit --json > npm-audit-after.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit-after.json', 'utf8'));
            console.log('Vulnerabilidades tras la remediación:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          } catch (error) {
            console.log('No se pudo interpretar el informe posterior:', String(error));
          }
          NODE
          npm audit --audit-level=moderate

      - name: Upload post-remediation npm audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-after-report
          path: npm-audit-after.json
          retention-days: 14
          if-no-files-found: ignore

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Verify ERP modules
        run: npm run verificar:modulos

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build local QA application
        run: npm run build

      - name: Start local QA application and verify source revision
        id: local_qa
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/erp-next.log 2>&1 &
          echo $! >/tmp/erp-next.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
            cat /tmp/erp-next.log
            echo "::error::No inició el servidor local de QA."
            exit 1
          fi
          if ! curl --fail --silent http://127.0.0.1:3000/app/03-datos-supabase.js | grep -Fq 'qa-source-audit-20261127-03'; then
            echo "::error::El servidor local no contiene el marcador de esta revisión QA."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Playwright local habilitado"
            echo 'La interfaz se compiló desde el commit actual y se conecta exclusivamente a Supabase QA. No se utiliza Vercel.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Playwright tests
        if: steps.local_qa.outputs.ready == 'true'
        run: npx playwright test
        env:
          ERP_URL: http://127.0.0.1:3000
          ERP_USER: ${{ secrets.ERP_USER }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ steps.local_qa.outputs.ready == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
